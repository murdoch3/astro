<script type="module">
// ════════════════════════════════════════════════════════════
//  Constants & helpers
// ════════════════════════════════════════════════════════════

const SIGNS = [
    { name:'Aries',       sym:'♈', glyph:'♈', element:'Fire',  mode:'Cardinal' },
    { name:'Taurus',      sym:'♉', glyph:'♉', element:'Earth', mode:'Fixed'    },
    { name:'Gemini',      sym:'♊', glyph:'♊', element:'Air',   mode:'Mutable'  },
    { name:'Cancer',      sym:'♋', glyph:'♋', element:'Water', mode:'Cardinal' },
    { name:'Leo',         sym:'♌', glyph:'♌', element:'Fire',  mode:'Fixed'    },
    { name:'Virgo',       sym:'♍', glyph:'♍', element:'Earth', mode:'Mutable'  },
    { name:'Libra',       sym:'♎', glyph:'♎', element:'Air',   mode:'Cardinal' },
    { name:'Scorpio',     sym:'♏', glyph:'♏', element:'Water', mode:'Fixed'    },
    { name:'Sagittarius', sym:'♐', glyph:'♐', element:'Fire',  mode:'Mutable'  },
    { name:'Capricorn',   sym:'♑', glyph:'♑', element:'Earth', mode:'Cardinal' },
    { name:'Aquarius',    sym:'♒', glyph:'♒', element:'Air',   mode:'Fixed'    },
    { name:'Pisces',      sym:'♓', glyph:'♓', element:'Water', mode:'Mutable'  },
];

const PLANETS = [
    { id: 0,  name:'Sun',     sym:'☉' },
    { id: 1,  name:'Moon',    sym:'☽' },
    { id: 2,  name:'Mercury', sym:'☿' },
    { id: 3,  name:'Venus',   sym:'♀' },
    { id: 4,  name:'Mars',    sym:'♂' },
    { id: 5,  name:'Jupiter', sym:'♃' },
    { id: 6,  name:'Saturn',  sym:'♄' },
    { id: 7,  name:'Uranus',  sym:'♅' },
    { id: 8,  name:'Neptune', sym:'♆' },
    { id: 9,  name:'Pluto',   sym:'♇' },
    { id: 10, name:'Mean Node', sym:'☊' },
];

const ASPECTS = [
    { name:'Conjunction', angle:0,   orb:8, sym:'☌' },
    { name:'Opposition',  angle:180, orb:8, sym:'☍' },
    { name:'Trine',       angle:120, orb:7, sym:'△' },
    { name:'Square',      angle:90,  orb:7, sym:'□' },
    { name:'Sextile',     angle:60,  orb:5, sym:'⚹' },
    { name:'Quincunx',    angle:150, orb:3, sym:'⚻' },
    { name:'Semi-sextile',angle:30,  orb:2, sym:'⚺' },
];

function lonToSign(lon) {
    const idx = Math.floor(((lon % 360) + 360) % 360 / 30);
    const deg = ((lon % 360) + 360) % 360 % 30;
    return { sign: SIGNS[idx], deg, idx };
}

function formatDMS(lon) {
    const norm = ((lon % 360) + 360) % 360;
    const { sign, deg } = lonToSign(norm);
    const d = Math.floor(deg);
    const m = Math.floor((deg - d) * 60);
    const s = Math.floor(((deg - d) * 60 - m) * 60);
    return `${d}°${m.toString().padStart(2,'0')}'${s.toString().padStart(2,'0')}" ${sign.sym} ${sign.name}`;
}

function getAspects(positions) {
    const results = [];
    const keys = Object.keys(positions);
    for (let i = 0; i < keys.length; i++) {
        for (let j = i + 1; j < keys.length; j++) {
            const a = positions[keys[i]];
            const b = positions[keys[j]];
            let diff = Math.abs(a - b) % 360;
            if (diff > 180) diff = 360 - diff;
            for (const asp of ASPECTS) {
                if (Math.abs(diff - asp.angle) <= asp.orb) {
                    results.push({
                        p1: keys[i], p2: keys[j],
                        aspect: asp,
                        orb: Math.abs(diff - asp.angle).toFixed(1)
                    });
                }
            }
        }
    }
    return results;
}

// ════════════════════════════════════════════════════════════
//  SVG chart drawing
// ════════════════════════════════════════════════════════════

function drawChart(planetData, cusps, asc) {
    const W = 500, H = 500, CX = 250, CY = 250;
    const R_OUTER = 220, R_SIGN_IN = 170;
    const R_HOUSE = 152, R_PLANET = 122, R_ASPECT = 80;
    const CYAN = '#00BFFF', TEAL = '#00CED1', DIM = '#003355', DARK = '#000022';

    // ── Coordinate system ──────────────────────────────────────
    // Standard Western chart: ASC at 9-o'clock (180° in SVG terms),
    // ecliptic longitude increases counter-clockwise.
    //
    // SVG angles: 0° = right (3 o'clock), increase clockwise.
    // Ecliptic lon: 0° = Aries, increase counter-clockwise on chart.
    //
    // Conversion: svgAngle = 180° - (eclipticLon - asc)
    //   • subtracting asc rotates so ASC maps to 0 in our frame
    //   • negating flips CW→CCW
    //   • adding 180° shifts 0 from right to left (9 o'clock)
    const ecl2svg = lon => {
        const deg = 180 - (((lon - asc) % 360) + 360) % 360;
        return deg * Math.PI / 180;
    };
    const point = (r, lon) => {
        const a = ecl2svg(lon);
        return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
    };

    let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
        style="background:#000011;font-family:'Anonymous Pro',monospace;">
    <defs>
        <radialGradient id="bg" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#000033"/>
            <stop offset="100%" stop-color="#000011"/>
        </radialGradient>
    </defs>
    <circle cx="${CX}" cy="${CY}" r="${R_OUTER}" fill="url(#bg)" stroke="${CYAN}" stroke-width="1.5"/>
    <circle cx="${CX}" cy="${CY}" r="${R_SIGN_IN}" fill="none" stroke="${DIM}" stroke-width="1"/>
    <circle cx="${CX}" cy="${CY}" r="${R_HOUSE}" fill="none" stroke="${DIM}" stroke-width="0.8"/>
    <circle cx="${CX}" cy="${CY}" r="${R_ASPECT}" fill="${DARK}" stroke="${DIM}" stroke-width="0.8"/>
    `;

    // ── Sign band ──────────────────────────────────────────────
    // Each sign starts at its actual ecliptic longitude (i * 30°)
    // and its glyph sits at the midpoint (i * 30 + 15)°.
    for (let i = 0; i < 12; i++) {
        const boundaryLon = i * 30;  // 0, 30, 60 ... 330
        const [x1, y1] = point(R_SIGN_IN, boundaryLon);
        const [x2, y2] = point(R_OUTER,   boundaryLon);
        svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${DIM}" stroke-width="1"/>`;

        const midLon = i * 30 + 15;
        const [gx, gy] = point((R_SIGN_IN + R_OUTER) / 2 + 2, midLon);
        const el = SIGNS[i].element;
        const col = el==='Fire'?'#FF6644':el==='Earth'?'#88BB44':el==='Air'?'#AADDFF':'#4499FF';
        svg += `<text x="${gx.toFixed(1)}" y="${gy.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
            font-size="14" fill="${col}" opacity="0.9">${SIGNS[i].glyph}</text>`;
    }

    // ── House cusps ────────────────────────────────────────────
    for (let i = 0; i < 12; i++) {
        const cuspLon = cusps[i];
        const [x1, y1] = point(R_ASPECT, cuspLon);
        const [x2, y2] = point(R_HOUSE,  cuspLon);
        const isAngle = i % 3 === 0;
        svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
            stroke="${isAngle ? CYAN : TEAL}" stroke-width="${isAngle ? 1.5 : 0.7}" opacity="${isAngle ? 1 : 0.6}"/>`;

        // House number at midpoint between this cusp and the next
        const nextLon = cusps[(i + 1) % 12];
        let span = (((nextLon - cuspLon) % 360) + 360) % 360;
        const midLon = cuspLon + span / 2;
        const [nx, ny] = point(R_HOUSE - 14, midLon);
        svg += `<text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
            font-size="9" fill="${DIM}" font-style="italic">${i + 1}</text>`;
    }

    // ── Aspect lines ───────────────────────────────────────────
    const posMap = {};
    for (const p of PLANETS) {
        if (planetData[p.name]) posMap[p.name] = planetData[p.name].lon;
    }
    const aspects = getAspects(posMap);
    for (const asp of aspects) {
        const [x1, y1] = point(R_ASPECT, posMap[asp.p1]);
        const [x2, y2] = point(R_ASPECT, posMap[asp.p2]);
        const col = asp.aspect.name === 'Conjunction' ? CYAN
                  : asp.aspect.name === 'Opposition'  ? '#FF4444'
                  : asp.aspect.name === 'Trine'       ? '#44FF88'
                  : asp.aspect.name === 'Square'      ? '#FF8844'
                  : asp.aspect.name === 'Sextile'     ? '#44AAFF'
                  : '#334455';
        svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
            stroke="${col}" stroke-width="0.7" opacity="0.5"/>`;
    }

    // ── Planet glyphs ──────────────────────────────────────────
    // Collect display angles to nudge overlapping symbols
    const placed = []; // { lon, displayLon }
    for (const p of PLANETS) {
        if (!planetData[p.name]) continue;
        const lon = planetData[p.name].lon;

        // Find a display longitude that doesn't clash
        let displayLon = lon;
        for (const prev of placed) {
            let diff = (((displayLon - prev.displayLon) % 360) + 360) % 360;
            if (diff > 180) diff = 360 - diff;
            if (diff < 7) displayLon += 8;
        }
        placed.push({ lon, displayLon });

        const [px, py] = point(R_PLANET, displayLon);
        // Tick from house ring to planet position
        const [tx1, ty1] = point(R_HOUSE, lon);
        const [tx2, ty2] = point(R_PLANET - 10, displayLon);
        svg += `<line x1="${tx1.toFixed(1)}" y1="${ty1.toFixed(1)}" x2="${tx2.toFixed(1)}" y2="${ty2.toFixed(1)}"
            stroke="${DIM}" stroke-width="0.5" opacity="0.5"/>`;
        svg += `<text x="${px.toFixed(1)}" y="${py.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
            font-size="13" fill="${CYAN}">${p.sym}</text>`;
    }

    // ── Angle labels ───────────────────────────────────────────
    const labelAngles = [
        { label:'ASC', lon: asc },
        { label:'DSC', lon: asc + 180 },
        { label:'MC',  lon: cusps[9] },
        { label:'IC',  lon: cusps[3] },
    ];
    for (const la of labelAngles) {
        const [lx, ly] = point(R_OUTER + 12, la.lon);
        svg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
            font-size="9" fill="${TEAL}" letter-spacing="1">${la.label}</text>`;
    }

    svg += `</svg>`;
    return svg;
}

// ════════════════════════════════════════════════════════════
//  Main: parse URL params, run Swiss Ephemeris, render page
// ════════════════════════════════════════════════════════════

const params = new URLSearchParams(window.location.search);
const name      = params.get('name')      || 'Native';
const birthdate = params.get('birthdate') || '1990-01-01';
const birthtime = params.get('birthtime') || '12:00';
const lat       = parseFloat(params.get('lat')  || '0');
const lon       = parseFloat(params.get('lon')  || '0');
const tz        = parseFloat(params.get('tz')   || '0');
const housesys  = params.get('housesys') || 'P';

// Parse birth date/time
const [yr, mo, dy] = birthdate.split('-').map(Number);
const [hr, mn]     = birthtime.split(':').map(Number);
const hourUT = hr + mn / 60 - tz;


// ══════════════════════════════════════════════════════════════════════════════
//  Secondary progressions: 1 day after birth = 1 year of life
// ══════════════════════════════════════════════════════════════════════════════

function classifyProgAspect(diff) {
    const d = ((diff % 360) + 360) % 360;
    const n = d > 180 ? 360 - d : d;
    if (n <= 8)  return 'Conjunction';
    if (n >= 52  && n <= 68)  return 'Benefic';   // sextile
    if (n >= 112 && n <= 128) return 'Benefic';   // trine
    if (n >= 82  && n <= 98)  return 'Adverse';   // square
    if (n >= 172 && n <= 188) return 'Adverse';   // opposition
    return null;
}

function progText(AL, key) {
    const text = AL?.progressions?.[key];
    if (!text) return '';
    return `<p style="line-height:1.8;text-align:justify;">${text}</p>`;
}


// ══════════════════════════════════════════════════════════════════════════════
//  Bi-wheel chart: natal (inner) + progressed (outer ring)
// ══════════════════════════════════════════════════════════════════════════════

function drawBiwheel(natalData, progData, cusps, asc, age) {
    const W = 560, H = 560, CX = 280, CY = 280;

    // Radii — layers from outside in:
    //   Progressed glyph band:  R_PROG_OUT … R_PROG_IN
    //   Sign band:              R_SIGN_OUT … R_SIGN_IN
    //   House ring:             R_HOUSE
    //   Natal glyph band:       R_NAT_OUT
    //   Aspect hub:             R_HUB
    const R_PROG_OUT  = 260;
    const R_PROG_IN   = 228;   // inner edge of progressed ring
    const R_SIGN_OUT  = 222;
    const R_SIGN_IN   = 192;
    const R_HOUSE     = 174;
    const R_NAT_OUT   = 148;
    const R_HUB       = 90;

    const CYAN = '#00BFFF', TEAL = '#00CED1', DIM = '#003355';
    const PROG_COL = '#FFD700'; // gold for progressed glyphs

    const ecl2svg = lon => {
        const deg = 180 - (((lon - asc) % 360) + 360) % 360;
        return deg * Math.PI / 180;
    };
    const point = (r, lon) => {
        const a = ecl2svg(lon);
        return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
    };

    let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
        style="background:#000011;font-family:'Anonymous Pro',monospace;">
    <defs>
        <radialGradient id="bwbg" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#000033"/>
            <stop offset="100%" stop-color="#000011"/>
        </radialGradient>
    </defs>
    <circle cx="${CX}" cy="${CY}" r="${R_PROG_OUT}" fill="none" stroke="${CYAN}" stroke-width="1.5"/>
    <circle cx="${CX}" cy="${CY}" r="${R_PROG_IN}"  fill="url(#bwbg)" stroke="${TEAL}" stroke-width="0.8" stroke-dasharray="3 2"/>
    <circle cx="${CX}" cy="${CY}" r="${R_SIGN_IN}"  fill="none" stroke="${DIM}" stroke-width="0.8"/>
    <circle cx="${CX}" cy="${CY}" r="${R_HOUSE}"    fill="none" stroke="${DIM}" stroke-width="0.6"/>
    <circle cx="${CX}" cy="${CY}" r="${R_HUB}"      fill="#000022" stroke="${DIM}" stroke-width="0.7"/>
    `;

    // ── Progressed ring ── sign boundaries & glyphs (outer ring)
    for (let i = 0; i < 12; i++) {
        const [x1, y1] = point(R_PROG_IN,  i * 30);
        const [x2, y2] = point(R_PROG_OUT, i * 30);
        svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${DIM}" stroke-width="0.7"/>`;

        const [gx, gy] = point((R_PROG_IN + R_PROG_OUT) / 2, i * 30 + 15);
        const el = SIGNS[i].element;
        const col = el==='Fire'?'#FF6644':el==='Earth'?'#88BB44':el==='Air'?'#AADDFF':'#4499FF';
        svg += `<text x="${gx.toFixed(1)}" y="${gy.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
            font-size="11" fill="${col}" opacity="0.6">${SIGNS[i].glyph}</text>`;
    }

    // ── Natal sign band (inner)
    for (let i = 0; i < 12; i++) {
        const [x1, y1] = point(R_SIGN_IN,  i * 30);
        const [x2, y2] = point(R_SIGN_OUT, i * 30);
        svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${DIM}" stroke-width="0.8"/>`;

        const [gx, gy] = point((R_SIGN_IN + R_SIGN_OUT) / 2, i * 30 + 15);
        const el = SIGNS[i].element;
        const col = el==='Fire'?'#FF6644':el==='Earth'?'#88BB44':el==='Air'?'#AADDFF':'#4499FF';
        svg += `<text x="${gx.toFixed(1)}" y="${gy.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
            font-size="12" fill="${col}" opacity="0.85">${SIGNS[i].glyph}</text>`;
    }

    // ── House cusps (cross inner rings only)
    for (let i = 0; i < 12; i++) {
        const cuspLon = cusps[i];
        const [x1, y1] = point(R_HUB,   cuspLon);
        const [x2, y2] = point(R_HOUSE, cuspLon);
        const isAngle = i % 3 === 0;
        svg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
            stroke="${isAngle ? CYAN : TEAL}" stroke-width="${isAngle ? 1.5 : 0.6}" opacity="${isAngle ? 1 : 0.5}"/>`;

        const nextLon = cusps[(i + 1) % 12];
        const span = (((nextLon - cuspLon) % 360) + 360) % 360;
        const [nx, ny] = point(R_HOUSE - 12, cuspLon + span / 2);
        svg += `<text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
            font-size="8" fill="${DIM}" font-style="italic">${i + 1}</text>`;
    }

    // ── Cross-wheel aspect lines (progressed → natal, drawn in hub)
    const PLANET_ORDER = ['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune'];
    for (const pn of PLANET_ORDER) {
        if (!progData[pn]) continue;
        for (const nn of PLANET_ORDER) {
            if (!natalData[nn]) continue;
            let diff = Math.abs(progData[pn].lon - natalData[nn].lon) % 360;
            if (diff > 180) diff = 360 - diff;
            let aspName = null, aspCol = null;
            if (diff <= 8)                        { aspName='Conjunction'; aspCol=CYAN;      }
            else if (diff >= 172 && diff <= 188)  { aspName='Opposition';  aspCol='#FF4444'; }
            else if (diff >= 112 && diff <= 128)  { aspName='Trine';       aspCol='#44FF88'; }
            else if (diff >= 82  && diff <= 98)   { aspName='Square';      aspCol='#FF8844'; }
            else if (diff >= 52  && diff <= 68)   { aspName='Sextile';     aspCol='#44AAFF'; }
            if (!aspName) continue;

            // Draw from progressed planet position (at R_PROG_IN) to natal position (at R_HUB)
            const [px, py] = point(R_PROG_IN - 4, progData[pn].lon);
            const [nx, ny] = point(R_HUB + 4,     natalData[nn].lon);
            svg += `<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}"
                stroke="${aspCol}" stroke-width="0.8" opacity="0.55"/>`;
        }
    }

    // ── Natal planet glyphs (inside sign band, between R_HUB and R_HOUSE)
    const natalPlaced = [];
    for (const p of PLANETS) {
        if (!natalData[p.name]) continue;
        const lon = natalData[p.name].lon;
        let displayLon = lon;
        for (const prev of natalPlaced) {
            let d = (((displayLon - prev.displayLon) % 360) + 360) % 360;
            if (d > 180) d = 360 - d;
            if (d < 7) displayLon += 8;
        }
        natalPlaced.push({ lon, displayLon });

        const r = (R_HOUSE + R_NAT_OUT) / 2;
        const [px, py] = point(r, displayLon);
        // tick from house ring
        const [tx1, ty1] = point(R_HOUSE, lon);
        const [tx2, ty2] = point(r - 10, displayLon);
        svg += `<line x1="${tx1.toFixed(1)}" y1="${ty1.toFixed(1)}" x2="${tx2.toFixed(1)}" y2="${ty2.toFixed(1)}"
            stroke="${DIM}" stroke-width="0.4" opacity="0.5"/>`;
        svg += `<text x="${px.toFixed(1)}" y="${py.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
            font-size="12" fill="${CYAN}">${p.sym}</text>`;
    }

    // ── Progressed planet glyphs (outer ring, between R_PROG_IN and R_PROG_OUT)
    const progPlaced = [];
    for (const p of PLANETS) {
        if (!progData[p.name]) continue;
        const lon = progData[p.name].lon;
        let displayLon = lon;
        for (const prev of progPlaced) {
            let d = (((displayLon - prev.displayLon) % 360) + 360) % 360;
            if (d > 180) d = 360 - d;
            if (d < 7) displayLon += 8;
        }
        progPlaced.push({ lon, displayLon });

        const r = (R_PROG_IN + R_PROG_OUT) / 2 + 6;
        const [px, py] = point(r, displayLon);
        // tick from prog ring inner edge
        const [tx1, ty1] = point(R_PROG_IN, lon);
        const [tx2, ty2] = point(r - 10, displayLon);
        svg += `<line x1="${tx1.toFixed(1)}" y1="${ty1.toFixed(1)}" x2="${tx2.toFixed(1)}" y2="${ty2.toFixed(1)}"
            stroke="#665500" stroke-width="0.4" opacity="0.6"/>`;
        svg += `<text x="${px.toFixed(1)}" y="${py.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
            font-size="11" fill="${PROG_COL}">${p.sym}</text>`;
    }

    // ── Labels: ASC / DSC / MC / IC
    for (const la of [
        { label:'ASC', lon: asc },
        { label:'DSC', lon: asc + 180 },
        { label:'MC',  lon: cusps[9] },
        { label:'IC',  lon: cusps[3] },
    ]) {
        const [lx, ly] = point(R_PROG_OUT + 14, la.lon);
        svg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
            font-size="8" fill="${TEAL}" letter-spacing="1">${la.label}</text>`;
    }

    // ── Legend
    svg += `<text x="${CX}" y="${CY - 12}" text-anchor="middle" font-size="9" fill="${CYAN}">Natal</text>`;
    svg += `<text x="${CX}" y="${CY + 5}"  text-anchor="middle" font-size="9" fill="${PROG_COL}">Age ${age}</text>`;

    svg += `</svg>`;
    return svg;
}

async function calcProgressions() {
    const age = parseInt(document.getElementById('prog-age').value, 10);
    if (!age || age < 1 || age > 120) return;

    const out = document.getElementById('prog-output');
    out.innerHTML = '<p style="color:#004466;">Calculating…</p>';

    try {
        const { swe, jd_birth, natal, cusps, asc, AL, lat, lon, housesys } = CHART;

        // Progressed JD: birth JD + age days
        const jd_prog = jd_birth + age;

        // Calculate progressed planet positions
        const PLANET_IDS = {
            Sun:0, Moon:1, Mercury:2, Venus:3, Mars:4,
            Jupiter:5, Saturn:6, Uranus:7, Neptune:8
        };
        const flags = 258; // SEFLG_SWIEPH | SEFLG_SPEED
        const progData = {};
        for (const [name, id] of Object.entries(PLANET_IDS)) {
            const r = swe.calc_ut(jd_prog, id, flags);
            if (r) {
                const arr = Array.isArray(r) ? r : [r[0], r[1], r[2], r[3]];
                progData[name] = { lon: ((arr[0] % 360) + 360) % 360 };
            }
        }

        // Progressed Moon sign and house
        const moonLon  = progData.Moon?.lon;
        const moonSign = moonLon != null ? lonToSign(moonLon).sign : null;
        let   moonHouse = null;
        if (moonLon != null) {
            moonHouse = 1;
            for (let i = 0; i < 12; i++) {
                const c1 = ((cusps[i] % 360) + 360) % 360;
                const c2 = ((cusps[(i+1)%12] % 360) + 360) % 360;
                const ml = ((moonLon % 360) + 360) % 360;
                const inH = c1 <= c2 ? (ml >= c1 && ml < c2) : (ml >= c1 || ml < c2);
                if (inH) { moonHouse = i + 1; break; }
            }
        }

        // ── Find aspects ──────────────────────────────────────────────────────
        const PLANET_ORDER = ['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune'];
        const solarAspects   = []; // progressed Sun to natal planets
        const mutualAspects  = []; // progressed planet to natal planet (non-sun)
        const moonAspects    = []; // progressed Moon to natal planets

        for (const progName of PLANET_ORDER) {
            if (!progData[progName]) continue;
            const pLon = progData[progName].lon;

            for (const natalName of PLANET_ORDER) {
                if (!natal[natalName]) continue;
                const nLon = natal[natalName].lon;
                const diff = pLon - nLon;
                const type = classifyProgAspect(diff);
                if (!type) continue;

                if (progName === 'Sun' && natalName !== 'Sun') {
                    solarAspects.push({ prog: progName, natal: natalName, type });
                } else if (progName === 'Moon' && natalName !== 'Moon') {
                    moonAspects.push({ prog: progName, natal: natalName, type });
                } else if (progName !== 'Sun' && progName !== 'Moon' && progName !== natalName) {
                    // Only prog→natal, avoid duplicates (use canonical order)
                    const pi = PLANET_ORDER.indexOf(progName);
                    const ni = PLANET_ORDER.indexOf(natalName);
                    if (pi !== ni) {
                        mutualAspects.push({ prog: progName, natal: natalName, type });
                    }
                }
            }
        }

        // ── Render ────────────────────────────────────────────────────────────
        const parts = [];

        // ── Bi-wheel SVG ──
        const biwheelSvg = drawBiwheel(natal, progData, cusps, asc, age);
        parts.push(`<div style="display:flex;justify-content:center;margin-bottom:12px;">${biwheelSvg}</div>`);
        parts.push(`<p style="font-size:0.78em;color:#003355;text-align:center;margin:-8px 0 16px;">
            Aspect lines: <span style="color:#00BFFF">☌ Conjunction</span> &nbsp;
            <span style="color:#FF4444">☍ Opposition</span> &nbsp;
            <span style="color:#44FF88">△ Trine</span> &nbsp;
            <span style="color:#FF8844">□ Square</span> &nbsp;
            <span style="color:#44AAFF">⚹ Sextile</span> &nbsp;
            &nbsp;<span style="color:#00BFFF">●</span> Natal &nbsp;
            <span style="color:#FFD700">●</span> Progressed
        </p>`);

        parts.push(`<h3 style="color:#00CED1;">Progressed Chart — Age ${age}</h3>`);
        parts.push(`<p style="font-size:0.85em;color:#004466;">Progressed Moon: ${moonSign ? moonSign.name : '?'} (House ${moonHouse ?? '?'})</p>`);

        // Progressed Moon sign
        if (moonSign) {
            const ms = progText(AL, `moon_sign_${moonSign.name}`);
            if (ms) {
                parts.push(`<h4 style="color:#00CED1;margin:16px 0 4px;">Progressed Moon in ${moonSign.glyph} ${moonSign.name}</h4>`);
                parts.push(ms);
            }
        }

        // Progressed Moon house
        if (moonHouse) {
            const mh = progText(AL, `moon_house_${moonHouse}`);
            if (mh) {
                parts.push(`<h4 style="color:#00CED1;margin:16px 0 4px;">Progressed Moon in House ${moonHouse}</h4>`);
                parts.push(mh);
            }
        }

        // Solar aspects
        if (solarAspects.length) {
            parts.push(`<h3 style="color:#00CED1;margin:20px 0 8px;">Solar Aspects</h3>`);
            for (const a of solarAspects) {
                const key = `solar_${a.prog}_${a.natal}_${a.type}`;
                const t = progText(AL, key);
                if (t) {
                    const sym = a.type==='Conjunction'?'☌':a.type==='Benefic'?'△':'□';
                    parts.push(`<h4 style="color:#00CED1;margin:12px 0 4px;font-size:0.95em;">
                        Progressed Sun ${sym} Natal ${a.natal}
                        <span style="color:#004466;font-weight:normal;font-size:0.85em;">(${a.type})</span>
                    </h4>`);
                    parts.push(t);
                }
            }
        }

        // Mutual / interplanetary aspects
        if (mutualAspects.length) {
            parts.push(`<h3 style="color:#00CED1;margin:20px 0 8px;">Interplanetary Aspects</h3>`);
            const seen = new Set();
            for (const a of mutualAspects) {
                // Canonicalise key order
                const names = [a.prog, a.natal].sort((x,y) => PLANET_ORDER.indexOf(x) - PLANET_ORDER.indexOf(y));
                const key = `mutual_${names[0]}_${names[1]}_${a.type}`;
                if (seen.has(key)) continue;
                seen.add(key);
                const t = progText(AL, key);
                if (t) {
                    const sym = a.type==='Conjunction'?'☌':a.type==='Benefic'?'△':'□';
                    parts.push(`<h4 style="color:#00CED1;margin:12px 0 4px;font-size:0.95em;">
                        Progressed ${a.prog} ${sym} ${a.natal}
                        <span style="color:#004466;font-weight:normal;font-size:0.85em;">(${a.type})</span>
                    </h4>`);
                    parts.push(t);
                }
            }
        }

        // Lunar aspects
        if (moonAspects.length) {
            parts.push(`<h3 style="color:#00CED1;margin:20px 0 8px;">Lunar Aspects</h3>`);
            for (const a of moonAspects) {
                const key = `moon_aspect_Moon_${a.natal}_${a.type}`;
                const t = progText(AL, key);
                if (t) {
                    const sym = a.type==='Conjunction'?'☌':a.type==='Benefic'?'△':'□';
                    parts.push(`<h4 style="color:#00CED1;margin:12px 0 4px;font-size:0.95em;">
                        Progressed Moon ${sym} Natal ${a.natal}
                        <span style="color:#004466;font-weight:normal;font-size:0.85em;">(${a.type})</span>
                    </h4>`);
                    parts.push(t);
                }
            }
        }

        if (parts.length <= 2) {
            parts.push('<p class="placeholder">No major progressed aspects found at this age within the standard orbs.</p>');
        }

        out.innerHTML = parts.join('');

    } catch(err) {
        out.innerHTML = `<p class="placeholder">Error calculating progressions: ${err.message}</p>`;
    }
}

// Module-level store for progression use
const CHART = {};

async function main() {
    // Load Alan Leo texts alongside the ephemeris
    let AL = {};
    try {
        const r = await fetch('alan_leo_texts.json');
        if (r.ok) AL = await r.json();
    } catch(e) { /* texts not yet present — placeholders will show */ }

    try {
        // Load swisseph-wasm directly from jsDelivr GitHub CDN
        const { default: SwissEph } = await import(
            'https://cdn.jsdelivr.net/gh/prolaxu/swisseph-wasm@main/src/swisseph.js'
        );

        const swe = new SwissEph();
        await swe.initSwissEph();

        // Julian Day in UT
        const jd = swe.julday(yr, mo, dy, hourUT);

        // Hardcode flag values (SEFLG_SWIEPH=2, SEFLG_SPEED=256)
        // Don't rely on swe.SEFLG_* instance properties — they may not be defined
        const FLAGS = 2 | 256; // 258

        // Hardcode planet ids — Swiss Ephemeris standard numbering
        const planetIds = {
            Sun:         0,
            Moon:        1,
            Mercury:     2,
            Venus:       3,
            Mars:        4,
            Jupiter:     5,
            Saturn:      6,
            Uranus:      7,
            Neptune:     8,
            Pluto:       9,
            'Mean Node': 10,
        };

        // Calculate planetary positions
        // calc_ut returns array [longitude, latitude, distance, speedLon, ...]
        // or occasionally an object {longitude, longitudeSpeed, ...}
        const planetData = {};
        for (const [pname, pid] of Object.entries(planetIds)) {
            try {
                const pos = swe.calc_ut(jd, pid, FLAGS);
                let lon, speed;
                if (Array.isArray(pos)) {
                    lon   = pos[0];
                    speed = pos[3] !== undefined ? pos[3] : 0;
                } else if (pos && typeof pos === 'object') {
                    lon   = pos.longitude !== undefined ? pos.longitude : pos[0];
                    speed = pos.longitudeSpeed !== undefined ? pos.longitudeSpeed : (pos[3] || 0);
                } else { continue; }
                if (lon == null || isNaN(lon)) continue;
                const info = lonToSign(lon);
                planetData[pname] = { lon, sign: info.sign, deg: info.deg, speed, retro: speed < 0 };
            } catch(e) { console.warn('Planet calc failed:', pname, e.message); }
        }

        // Calculate house cusps
        // houses() returns { cusps: [...], ascmc: [asc, mc, ...] }
        // cusps may be 13-element (index 0 unused) or 12-element depending on version
        const houseResult = swe.houses(jd, lat, lon, housesys);
        const rawCusps = Array.from(houseResult.cusps);
        // If 13 elements the first is a dummy 0; if 12 it's already correct
        const cusps = rawCusps.length === 13 ? rawCusps.slice(1) : rawCusps.slice(0, 12);
        const asc   = houseResult.ascmc[0];
        const mc    = houseResult.ascmc[1];

        swe.close();

        // Assign planets to houses
        for (const p of Object.values(planetData)) {
            p.house = whichHouse(p.lon, cusps);
        }

        renderPage(planetData, cusps, asc, mc, AL);

        // Store for progressions
        CHART.swe       = swe;
        CHART.jd_birth  = jd;
        CHART.natal     = planetData;
        CHART.cusps     = cusps;
        CHART.asc       = asc;
        CHART.AL        = AL;
        CHART.lat       = lat;
        CHART.lon       = lon;
        CHART.housesys  = housesys;

        document.getElementById('prog-btn').addEventListener('click', calcProgressions);

    } catch(err) {
        document.getElementById('main-content').innerHTML = `
            <section>
                <h2>⚠ Calculation Error</h2>
                <p>Could not load the Swiss Ephemeris module. This may be due to a network issue or browser restriction.</p>
                <pre style="font-size:0.8em;color:#666;white-space:pre-wrap;">${err.message}\n\n${err.stack||''}</pre>
                <p><a href="natal_form.html">← Back to form</a></p>
            </section>`;
    }
}

// Determine which house (1–12) a longitude falls in given the 12 cusp longitudes
function whichHouse(lon, cusps) {
    const norm = n => ((n % 360) + 360) % 360;
    const p = norm(lon);
    for (let i = 0; i < 12; i++) {
        const c1 = norm(cusps[i]);
        const c2 = norm(cusps[(i + 1) % 12]);
        const inHouse = c1 <= c2
            ? p >= c1 && p < c2
            : p >= c1 || p < c2;   // wraps through 0°
        if (inHouse) return i + 1;
    }
    return 1;
}

// Look up Alan Leo text or return a styled placeholder
function alText(AL, section, key) {
    const text = AL?.[section]?.[key];
    if (!text) return `<p class="placeholder">[${section} / ${key}] — text to be added from Alan Leo's <em>The Key to Your Own Nativity</em>.</p>`;
    // Pluto and Mean Node entries are explanatory notes, not Leo text — style differently
    if (key === 'Pluto' || key === 'Mean Node') {
        return `<p style="color:#004466;font-style:italic;border-left:2px solid #002244;padding-left:12px;">${text}</p>`;
    }
    return `<p style="line-height:1.8;text-align:justify;">${text}</p>`;
}

// Look up an aspect text. Tries both planet orderings.
function alAspect(AL, p1, p2, aspType) {
    const k1 = `${p1}_${p2}_${aspType}`;
    const k2 = `${p2}_${p1}_${aspType}`;
    const text = AL?.aspects?.[k1] || AL?.aspects?.[k2];
    if (text) return `<p style="line-height:1.8;text-align:justify;">${text}</p>`;
    return '';  // silently omit missing aspect entries
}

// Classify an angular difference as Conjunction / Benefic / Adverse
function classifyAspect(diff) {
    const d = Math.abs(diff) % 360;
    const n = d > 180 ? 360 - d : d;
    if (n <= 10)  return 'Conjunction';
    if (n >= 50  && n <= 70)  return 'Benefic';   // sextile
    if (n >= 110 && n <= 130) return 'Benefic';   // trine
    if (n >= 80  && n <= 100) return 'Adverse';   // square
    if (n >= 170 && n <= 190) return 'Adverse';   // opposition
    if (n >= 140 && n <= 155) return 'Adverse';   // quincunx (minor)
    return null;
}

// Build all detected aspects for a set of planet positions
function buildAspectReadings(AL, planetData) {
    const order = ['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune'];
    const results = [];
    for (let i = 0; i < order.length; i++) {
        for (let j = i + 1; j < order.length; j++) {
            const p1 = order[i], p2 = order[j];
            if (!planetData[p1] || !planetData[p2]) continue;
            const diff = planetData[p1].lon - planetData[p2].lon;
            const type = classifyAspect(diff);
            if (!type) continue;
            const text = alAspect(AL, p1, p2, type);
            if (text) results.push({ p1, p2, type, text });
        }
    }
    return results;
}

                    <li><a href="#al-s2">§2 — Individuality</a></li>

                    <li><a href="#al-s5">§5 — The Houses</a></li>

                    <li><a href="#al-s7">§7 — Progressions</a></li>

    </section>

    <!-- ── Chart ── -->
    <section id="chart">

        <div id="chart-wrapper">${svg}</div>
        <p style="font-size:0.78em;color:#003355;text-align:center;margin-top:8px;">
            Aspect lines: <span style="color:#00BFFF">☌ Conjunction</span> &nbsp;
            <span style="color:#FF4444">☍ Opposition</span> &nbsp;
            <span style="color:#44FF88">△ Trine</span> &nbsp;
            <span style="color:#FF8844">□ Square</span> &nbsp;
            <span style="color:#44AAFF">⚹ Sextile</span>

    </section>

    <!-- ── Planetary positions ── -->
    <section id="planet-table">
        <h2>II. Planetary Positions</h2>
        <div class="table-container">
        <table>
            <thead><tr>
                <th></th><th>Planet</th><th>Position</th><th>House</th><th>Sign</th><th>Element</th><th>Mode</th><th>R</th>
            </tr></thead>
            <tbody>
            ${PLANETS.filter(p=>planetData[p.name]).map(p => {
                const d = planetData[p.name];
                return `<tr>
                    <td class="glyph">${p.sym}</td>
                    <td>${p.name}</td>
                    <td style="white-space:nowrap">${formatDMS(d.lon)}</td>
                    <td style="text-align:center">${d.house}</td>
                    <td>${d.sign.glyph} ${d.sign.name}</td>
                    <td>${d.sign.element}</td>
                    <td>${d.sign.mode}</td>
                    <td style="text-align:center">${d.retro ? '<span style="color:#FF6644">℞</span>' : ''}</td>

            </tbody>
        </table>

    </section>

    <!-- ── House cusps ── -->
    <section id="house-table">
        <h2>III. House Cusps</h2>
        <div class="table-container">
        <table>
            <thead><tr><th>House</th><th>Cusp</th><th>Sign</th><th>Planets</th></tr></thead>
            <tbody>
            ${cusps.map((c, i) => {
                const si = lonToSign(c);
                const planetsInHouse = PLANETS.filter(p => planetData[p.name] && planetData[p.name].house === i+1);
                return `<tr>
                    <td>${i+1}${i===0?' (ASC)':i===3?' (IC)':i===6?' (DSC)':i===9?' (MC)':''}</td>
                    <td style="white-space:nowrap">${formatDMS(c)}</td>
                    <td>${si.sign.glyph} ${si.sign.name}</td>
                    <td>${planetsInHouse.map(p=>p.sym+' '+p.name).join(', ')}</td>

            }).join('')}
            </tbody>
        </table>
        </div>
    </section>

    <!-- ── Aspects ── -->
    <section id="aspect-table">
        <h2>IV. Aspects</h2>
        <div class="table-container">
        <table>
            <thead><tr><th></th><th>Planet 1</th><th>Aspect</th><th>Planet 2</th><th>Orb</th></tr></thead>
            <tbody>
            ${aspects.length ? aspects.map(a => `<tr>
                <td class="glyph">${a.aspect.sym}</td>
                <td>${a.p1}</td>
                <td>${a.aspect.name}</td>
                <td>${a.p2}</td>
                <td>${a.orb}°</td>
            </tr>`).join('') : '<tr><td colspan="5" style="color:#004466;font-style:italic">No major aspects within orbs.</td></tr>'}
            </tbody>
        </table>
        </div>
    </section>

    <!-- ── Counts ── -->
    <section id="counts">
        <h2>V. Triplicities, Quadruplicities &amp; Polarities</h2>

        <h3>Triplicities (Elements)</h3>
        <div class="counts-grid">
            ${['Fire','Earth','Air','Water'].map(el => `
            <div class="count-box">
                <div class="label">${el}</div>
                <div class="value">${elemCount[el]}</div>
                <div class="detail">${['Fire','Earth','Air','Water'].map(e=>PLANETS.filter(p=>planetData[p.name]&&planetData[p.name].sign.element===e).map(p=>p.sym).join(' ')).filter((_,i)=>['Fire','Earth','Air','Water'][i]===el)[0] || ''}</div>
            </div>`).join('')}
        </div>

        <h3>Quadruplicities (Modes)</h3>
        <div class="counts-grid">
            ${['Cardinal','Fixed','Mutable'].map(mode => `
            <div class="count-box">
                <div class="label">${mode}</div>
                <div class="value">${modeCount[mode]}</div>
                <div class="detail">${PLANETS.filter(p=>planetData[p.name]&&planetData[p.name].sign.mode===mode).map(p=>p.sym).join(' ')}</div>
            </div>`).join('')}
        </div>

        <h3>Polarities</h3>
        <div class="counts-grid">
            <div class="count-box">

                <div class="value">${elemCount.Earth + elemCount.Water}</div>

    <!-- ══════════════════════════════════════════════════════
         ALAN LEO SECTIONS
         ══════════════════════════════════════════════════════ -->
    <section id="alan-leo">
        <h2>VI. Horoscope Readings</h2>
        <p style="font-size:0.85em;color:#004466;">
            Interpretive text drawn from Alan Leo, <em>The Key to Your Own Nativity</em> (1910).
            Public domain. Placeholder sections marked below will be populated as texts are keyed in.
        </p>
    </section>

    <!-- § 1 — Ruling Planet -->
    <section id="al-s1">
        <h2>§1 — The Ruling Planet</h2>
        <ul class="section-chapters">
            <li><span class="chap-num">Ch. I</span>   <span class="chap-title">The Ascendant and the Rising Sign</span> <span class="chap-tag">[${ascSign.sign.name}]</span></li>
            <li><span class="chap-num">Ch. II</span>  <span class="chap-title">The Ruling Planet</span>                 <span class="chap-tag">[${rulingPlanetName}]</span></li>
            <li><span class="chap-num">Ch. III</span> <span class="chap-title">The Position of the Ruling Planet in the Houses</span> <span class="chap-tag">[House ${planetData[rulingPlanetName]?.house || '?'}]</span></li>
            <li><span class="chap-num">Ch. IV</span>  <span class="chap-title">The Position in the Signs of the Sun as Ruler</span>   <span class="chap-tag">[${planetData.Sun?.sign.name || '?'}]</span></li>
            <li><span class="chap-num">Ch. V</span>   <span class="chap-title">The Moon</span>         <span class="chap-tag">[${planetData.Moon?.sign.name || '?'}]</span></li>
            <li><span class="chap-num">Ch. VI</span>  <span class="chap-title">Mercury</span>          <span class="chap-tag">[${planetData.Mercury?.sign.name || '?'}]</span></li>
            <li><span class="chap-num">Ch. VII</span> <span class="chap-title">Venus</span>            <span class="chap-tag">[${planetData.Venus?.sign.name || '?'}]</span></li>
            <li><span class="chap-num">Ch. VIII</span><span class="chap-title">Mars</span>             <span class="chap-tag">[${planetData.Mars?.sign.name || '?'}]</span></li>
            <li><span class="chap-num">Ch. IX</span>  <span class="chap-title">Jupiter</span>          <span class="chap-tag">[${planetData.Jupiter?.sign.name || '?'}]</span></li>
            <li><span class="chap-num">Ch. X</span>   <span class="chap-title">Saturn</span>           <span class="chap-tag">[${planetData.Saturn?.sign.name || '?'}]</span></li>
            <li><span class="chap-num">Ch. XI</span>  <span class="chap-title">The House-Position of Uranus</span>  <span class="chap-tag">[House ${planetData.Uranus?.house || '?'}]</span></li>
            <li><span class="chap-num">Ch. XII</span> <span class="chap-title">Neptune</span>          <span class="chap-tag">[House ${planetData.Neptune?.house || '?'}]</span></li>
        </ul>
        <h3>Ch. I — The Ascendant: ${ascSign.sign.name} Rising</h3>
        ${alText(AL, 'rising_sign', ascSign.sign.name)}
        <h3>Personal Appearance</h3>
        ${alText(AL, 'rising_sign_appearance', ascSign.sign.name)}
        <h3>Ch. II — The Ruling Planet: ${rulingPlanetName}</h3>
        ${alText(AL, 'ruling_planet', rulingPlanetName)}
        <h3>Ch. III — Position of the Ruling Planet in the Houses: House ${planetData[rulingPlanetName]?.house || '?'}</h3>
        ${alText(AL, 'ruling_planet_in_house', String(planetData[rulingPlanetName]?.house || ''))}
        <h3>Ch. IV–X — The Ruling Planet (${rulingPlanetName}) in ${planetData[rulingPlanetName]?.sign.name || '?'}</h3>
        ${ (() => {
            const rulerKey = {
                Sun: 'sun_as_ruler_in_sign', Moon: 'moon_as_ruler_in_sign',
                Mercury: 'mercury_as_ruler_in_sign', Venus: 'venus_as_ruler_in_sign',
                Mars: 'mars_as_ruler_in_sign', Jupiter: 'jupiter_as_ruler_in_sign',
                Saturn: 'saturn_as_ruler_in_sign'
            }[rulingPlanetName];
            return rulerKey ? alText(AL, rulerKey, planetData[rulingPlanetName]?.sign.name || '') : '<p class="placeholder">Uranus/Neptune as ruler — text to be added.</p>';
        })() }
        <h3>Ch. XI — Uranus in House ${planetData.Uranus?.house || '?'}</h3>
        ${alText(AL, 'uranus_in_house', String(planetData.Uranus?.house || ''))}
        <h3>Ch. XII — Neptune in House ${planetData.Neptune?.house || '?'}</h3>
        ${alText(AL, 'neptune_in_house', String(planetData.Neptune?.house || ''))}
    </section>

    <!-- § 2 — Individuality -->
    <section id="al-s2">
        <h2>§2 — Individuality</h2>
        <ul class="section-chapters">
            <li><span class="chap-num">Ch. XIII</span><span class="chap-title">Individual Characteristics</span> <span class="chap-tag">[Sun in ${planetData.Sun?.sign.name || '?'}, House ${planetData.Sun?.house || '?'}]</span></li>
        </ul>
        <h3>Ch. XIII — Sun in ${planetData.Sun?.sign.name || '?'}</h3>
        ${alText(AL, 'sun_in_sign', planetData.Sun?.sign.name || '')}
    </section>

    <!-- § 3 — Personality -->
    <section id="al-s3">
        <h2>§3 — Personality</h2>
        <ul class="section-chapters">
            <li><span class="chap-num">Ch. XIV</span><span class="chap-title">Personal Characteristics</span>    <span class="chap-tag">[${ascSign.sign.name} Rising]</span></li>
            <li><span class="chap-num">Ch. XV</span> <span class="chap-title">The Moon's House-Position</span>   <span class="chap-tag">[Moon in House ${planetData.Moon?.house || '?'}]</span></li>
        </ul>
        <h3>Ch. XIV — Personal Characteristics: Moon in ${planetData.Moon?.sign.name || '?'}</h3>
        ${alText(AL, 'moon_in_sign', planetData.Moon?.sign.name || '')}
        <h3>Ch. XV — Moon's House-Position: House ${planetData.Moon?.house || '?'}</h3>
        ${alText(AL, 'moon_in_house', String(planetData.Moon?.house || ''))}
    </section>

    <!-- § 4 — Mentality -->
    <section id="al-s4">
        <h2>§4 — Mentality</h2>
        <h3>Ch. XVI — Mental Qualifications: Mercury in ${planetData.Mercury?.sign.name || '?'}</h3>
        ${alText(AL, 'mercury_in_sign', planetData.Mercury?.sign.name || '')}
        <h3>Ch. XVII — Mercury's House-Position: House ${planetData.Mercury?.house || '?'}</h3>
        ${alText(AL, 'mercury_in_house', String(planetData.Mercury?.house || ''))}
        <h3>Ch. XVIII — Positions and Aspects of the Sun, Moon and Planets</h3>
        ${ (() => {
            const aspectReadings = buildAspectReadings(AL, planetData);
            if (!aspectReadings.length) return '<p class="placeholder">No major aspects detected within orbs.</p>';
            return aspectReadings.map(a =>
                `<h4 style="color:#00CED1;margin:16px 0 4px;font-size:0.95em;">
                    ${a.p1} ${a.type === 'Conjunction' ? '☌' : a.type === 'Benefic' ? '△' : '□'} ${a.p2}
                    <span style="color:#004466;font-weight:normal;font-size:0.85em;">(${a.type})</span>
                 </h4>${a.text}`
            ).join('');
        })() }
    </section>

    <!-- § 5 — The Houses -->
    <section id="al-s5">
        <h2>§5 — The Houses of the Horoscope</h2>
        <p style="font-size:0.85em;color:#004466;">
            Each house is interpreted by the planet occupying it, or — when empty — by the mode (Cardinal/Fixed/Mutable)
            of the sign on its cusp.
        </p>

        ${ (() => {
            // Helper: given a house number (1-12), find the governing planet name or sign mode
            function houseKey(houseNum) {
                const RULERS = {
                    Aries:'Mars', Taurus:'Venus', Gemini:'Mercury', Cancer:'Moon',
                    Leo:'Sun', Virgo:'Mercury', Libra:'Venus', Scorpio:'Mars',
                    Sagittarius:'Jupiter', Capricorn:'Saturn', Aquarius:'Saturn', Pisces:'Jupiter'
                };
                // Planet in this house?
                for (const p of PLANETS) {
                    if (planetData[p.name] && planetData[p.name].house === houseNum) {
                        return p.name;
                    }
                }
                // Fall back to sign mode on cusp
                const cuspSign = lonToSign(cusps[houseNum - 1]);
                return cuspSign.sign.mode; // 'Cardinal', 'Fixed', or 'Mutable'
            }

            const h2key  = houseKey(2);
            const h3key  = houseKey(3);
            const h4key  = houseKey(4);
            const h5key  = houseKey(5);
            const h6key  = houseKey(6);
            const h7key  = houseKey(7);
            const h8key  = houseKey(8);
            const h9key  = houseKey(9);
            const h10key = houseKey(10);
            const h11key = houseKey(11);
            const h12key = houseKey(12);

            // 11th house — element fallback instead of mode
            function friendsKey(houseNum) {
                for (const p of PLANETS) {
                    if (planetData[p.name] && planetData[p.name].house === houseNum) return p.name;
                }
                return lonToSign(cusps[houseNum - 1]).sign.element; // Fire/Earth/Air/Water
            }
            const h11friends = friendsKey(11);

            const parts = [
                '<h3>Ch. XIX — Finance (House 2: ' + h2key + ')</h3>' + alText(AL, 'finance_planet', h2key),
                '<h3>Ch. XX — Travel (House 3: ' + h3key + ')</h3>' + alText(AL, 'travel_planet', h3key),
                '<h3>Ch. XXI — Environment (House 4: ' + h4key + ')</h3>' + alText(AL, 'environment_planet', h4key),
                '<h3>Ch. XXII — Enterprise (House 5: ' + h5key + ')</h3>' + alText(AL, 'enterprise_planet', h5key),
                '<h3>Ch. XXIII — Sickness (House 6: ' + h6key + ')</h3>' + alText(AL, 'sickness_planet', h6key),
                '<h3>Ch. XXIV — Marriage (House 7: ' + h7key + ')</h3>' + alText(AL, 'marriage_planet', h7key),
                '<h3>Ch. XXV — Marriage Prospects: Venus in ' + (planetData.Venus?.sign.name || '?') + '</h3>' + alText(AL, 'venus_marriage_in_sign', planetData.Venus?.sign.name || ''),
                '<h3>Ch. XXVI — Legacies (House 8: ' + h8key + ')</h3>' + alText(AL, 'legacies_planet', h8key),
                '<h3>Ch. XXVII — Philosophy (House 9: ' + h9key + ')</h3>' + alText(AL, 'philosophy_planet', h9key),
                '<h3>Ch. XXVIII — Profession (House 10: ' + h10key + ')</h3>' + alText(AL, 'profession_planet', h10key),
                '<h3>Ch. XXIX — Friends (House 11: ' + h11friends + ')</h3>' + alText(AL, 'friends_planet', h11friends),
                '<h3>Ch. XXX — Occultism (House 12: ' + h12key + ')</h3>' + alText(AL, 'occultism_planet', h12key),
            ];
            return parts.join('');
        })() }
    </section>

    <!-- § 6 — Summary -->
    <section id="al-s6">
        <h2>§6 — Summary of the Horoscope</h2>
        <h3>Ch. XXXIII — The Polarities: Sun in ${planetData.Sun?.sign.name || '?'}, Moon in ${planetData.Moon?.sign.name || '?'}</h3>
        ${alText(AL, 'polarities', (planetData.Sun?.sign.name || '') + '_' + (planetData.Moon?.sign.name || ''))}
        ${ (() => {
            // ── Ch. XXXI: Planetary Positions ──────────────────────────────
            // Count planets above/below horizon and rising/setting (east/west)
            const planetNames = PLANETS.map(p => p.name).filter(n => planetData[n]);
            const total = planetNames.length;
            let rising = 0, setting = 0, above = 0, below = 0;
            for (const n of planetNames) {
                const lon = planetData[n].lon;
                // asc already in scope as parameter
                // Relative to ASC: east = rising side (houses 12,1,2), west = setting (6,7,8)
                // Above horizon: houses 7-12, below: 1-6
                const h = planetData[n].house;
                if (h >= 1 && h <= 6)  below++;  else above++;
                // Rising = east of meridian but above horizon, or: houses 10,11,12,1,2,3
                if (h >= 10 || h <= 3) rising++; else setting++;
            }
            // Determine dominant position
            let posKey;
            if (rising > setting && rising > total/2)       posKey = 'Rising';
            else if (setting > rising && setting > total/2) posKey = 'Setting';
            else if (above > below && above > total/2)      posKey = 'Above';
            else                                             posKey = 'Below';

            // ── Ch. XXXI: Triplicities ──────────────────────────────────────
            const elementCount = {Fire:0, Earth:0, Air:0, Water:0};
            for (const n of planetNames) elementCount[planetData[n].sign.element]++;
            // Sun/Moon tiebreaker
            const sunEl  = planetData.Sun?.sign.element;
            const moonEl = planetData.Moon?.sign.element;
            let topElement = Object.keys(elementCount).reduce((a,b) => {
                if (elementCount[b] > elementCount[a]) return b;
                if (elementCount[b] === elementCount[a]) {
                    const aVotes = (a===sunEl?2:0)+(a===moonEl?1:0);
                    const bVotes = (b===sunEl?2:0)+(b===moonEl?1:0);
                    return bVotes >= aVotes ? b : a;
                }
                return a;
            });

            // ── Ch. XXXI: Qualities ─────────────────────────────────────────
            const modeCount = {Cardinal:0, Fixed:0, Mutable:0};
            for (const n of planetNames) modeCount[planetData[n].sign.mode]++;
            const sunMode  = planetData.Sun?.sign.mode;
            const moonMode = planetData.Moon?.sign.mode;
            let topMode = Object.keys(modeCount).reduce((a,b) => {
                if (modeCount[b] > modeCount[a]) return b;
                if (modeCount[b] === modeCount[a]) {
                    const aVotes = (a===sunMode?2:0)+(a===moonMode?1:0);
                    const bVotes = (b===sunMode?2:0)+(b===moonMode?1:0);
                    return bVotes >= aVotes ? b : a;
                }
                return a;
            });

            // ── Ch. XXXI: Sun/Moon quality combination ──────────────────────
            // Key is either "SunElement_MoonElement" or "SunMode_MoonMode"
            const smElKey   = sunEl + '_' + moonEl;
            const smModeKey = sunMode + '_' + moonMode;
            // Try element key first (Fire/Air/etc), then mode key (Cardinal/Fixed/etc)
            const smText = alText(AL, 'sun_moon_quality', smElKey) ||
                           alText(AL, 'sun_moon_quality', smModeKey);

            // ── Ch. XXXII: Rising planet ────────────────────────────────────
            // Find planet closest to ASC in houses 12, 1, or 2
            let risingPlanet = null, risingDist = 999;
            for (const n of planetNames) {
                const h = planetData[n].house;
                if (h === 12 || h === 1 || h === 2) {
                    // asc already in scope as parameter
                    let dist = Math.abs(((planetData[n].lon - asc + 360) % 360));
                    if (dist > 180) dist = 360 - dist;
                    if (dist < risingDist) { risingDist = dist; risingPlanet = n; }
                }
            }

            // ── Ch. XXXII: Personal colouring ───────────────────────────────
            const moonSignName = planetData.Moon?.sign.name || '';

            // Build output
            const parts31 = [
                '<h3>Ch. XXXI — Planetary Positions: ' + posKey + '</h3>',
                alText(AL, 'planetary_positions', posKey),
                '<h3>Ch. XXXI — The Triplicities: Majority in ' + topElement + '</h3>',
                alText(AL, 'triplicity_summary', topElement),
                '<h3>Ch. XXXI — The Qualities: Majority in ' + topMode + '</h3>',
                alText(AL, 'quality_summary', topMode),
                '<h3>Ch. XXXI — Sun &amp; Moon: ' + sunEl + ' / ' + moonEl + '</h3>',
                smText || '<p class="placeholder">[sun_moon_quality / ' + smElKey + '] — no entry found.</p>',
            ];
            const parts32 = risingPlanet ? [
                '<h3>Ch. XXXII — Rising Planet: ' + risingPlanet + '</h3>',
                alText(AL, 'rising_planet', risingPlanet),
                '<h3>Ch. XXXII — Personal Colouring: Moon in ' + moonSignName + '</h3>',
                alText(AL, 'personal_colouring', moonSignName),
            ] : [
                '<p style="color:#004466;font-size:0.85em;">No planet found near the Ascendant (houses 12–2); supplementary paragraphs omitted.</p>',
            ];

            return parts31.concat(parts32).join('');
        })() }
    </section>

    <!-- § 7 — Progressions -->
    <section id="al-s7">
        <h2>§7 — The Progression of the Horoscope</h2>
        <p style="font-size:0.85em;color:#004466;">
            Secondary progressions: each day after birth = one year of life. Enter an age to see
            progressed planetary positions and aspects to the natal chart.
        </p>
        <div style="display:flex;gap:12px;align-items:center;margin:16px 0;">
            <label for="prog-age" style="color:#00CED1;font-size:0.9em;text-transform:uppercase;letter-spacing:0.05em;">Age:</label>
            <input type="number" id="prog-age" min="1" max="120" value="30"
                style="width:80px;background:#000022;border:1px solid #00BFFF;color:#00BFFF;
                       font-family:inherit;font-size:1em;padding:6px 10px;outline:none;">
            <button id="prog-btn"
                style="background:rgba(0,191,255,0.08);border:1px solid #00BFFF;color:#00BFFF;
                       font-family:inherit;font-size:0.9em;padding:6px 14px;cursor:pointer;
                       letter-spacing:0.08em;text-transform:uppercase;">
                Calculate
            </button>
        </div>
        <div id="prog-output">
            <p class="placeholder">Enter an age above and click Calculate to see your progressed chart.</p>
        </div>
    </section>

    `;
}

main();
</script>
